name: PC 도우미 빌드

# helper/ 폴더나 페이지가 바뀌어 main에 올라가면 자동으로 빌드하고,
# helper/pick_helper.py 의 VERSION 으로 Release(helper-v버전)를 만들거나 갱신해요.
on:
  push:
    branches: [main]
    paths: ["helper/**", "index.html", ".github/workflows/build-helper.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: PickHelper-Windows.zip
          - os: macos-latest
            asset: PickHelper-Mac.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 테스트
        run: python -m unittest discover tests

      - name: 실행 파일 만들기
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller certifi
          pyinstaller --onefile --name PickHelper --hidden-import certifi --hidden-import hashlib --hidden-import sqlite3 --hidden-import csv --hidden-import zipfile --hidden-import shutil --hidden-import tempfile --hidden-import logging --hidden-import queue --hidden-import concurrent.futures --hidden-import uuid --hidden-import datetime --add-data "index.html:site" --add-data "data:site/data" helper/pick_helper.py

      - name: 압축 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/PickHelper.exe -DestinationPath ${{ matrix.asset }}

      - name: 압축 (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/PickHelper ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 버전 읽기
        id: ver
        run: echo "version=$(grep -oP '^VERSION = "\K[^"]+' helper/pick_helper.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: helper-v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PC 도우미 ${{ steps.ver.outputs.version }}
          make_latest: true
          body: |
            픽창 판독기 PC 도우미입니다. 롤 클라이언트의 픽창(포지션, 픽, 밴)을 자동으로 읽어 판독기에 채워줘요.
            - Windows: PickHelper-Windows.zip 압축을 풀고 PickHelper.exe 실행
            - Mac (Apple 실리콘): PickHelper-Mac.zip 압축을 풀고 PickHelper 실행
            처음 실행할 때 나오는 보안 경고는 README의 "PC 도우미" 항목을 참고하세요.
          files: dist/*.zip
