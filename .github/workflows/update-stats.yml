name: 통계 갱신

on:
  schedule:
    - cron: "17 18 * * *"   # 매일 03:17 (KST) — 쉬다 와도 최신 패치 메타로 추천받도록
  workflow_dispatch:
    inputs:
      max_matches:
        description: "이번에 새로 받을 최대 경기 수"
        default: "3000"

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 경기 캐시 복원
        uses: actions/cache@v4
        with:
          path: data/cache
          key: matches-${{ github.run_id }}
          restore-keys: matches-

      - name: 집계 로직 테스트
        run: python -m unittest discover tests

      - name: Riot API로 수집
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          if [ -z "$RIOT_API_KEY" ]; then
            echo "::error::저장소 Settings > Secrets and variables > Actions 에 RIOT_API_KEY를 등록하세요."
            exit 1
          fi
          python scripts/collect.py --max-matches "${{ github.event.inputs.max_matches || '3000' }}"

      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "통계 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi
